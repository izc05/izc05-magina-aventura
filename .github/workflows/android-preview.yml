name: Android Preview APK

on:
  push:
    branches:
      - feat/visual-identity-onboarding-v1
      - feat/visual-route-flow-v1
      - feat/visual-adventure-summary-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate approved brand raster assets
        working-directory: apps/mobile
        run: pnpm brand:assets

      - name: Generate Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build standalone preview APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: magina-aventura-demo-complete
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
