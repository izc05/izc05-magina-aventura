name: Android Route Simulator Emulator Smoke

on:
  push:
    branches:
      - feat/route-01-emulator-smoke
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-route-simulator-emulator-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      EXPO_PUBLIC_ENABLE_QA_ROUTE_SIMULATOR: '1'
      EXPO_PUBLIC_QA_ROUTE_SIMULATOR_ENTRY: '1'
      QA_PACKAGE: com.isivolt.maginaaventura.routesim

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Route simulator tests
        run: pnpm --filter @magina-aventura/route-simulator test

      - name: Generate clean Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Isolate simulator application id and label
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          build_gradle = Path("android/app/build.gradle")
          strings = Path("android/app/src/main/res/values/strings.xml")

          gradle_lines = build_gradle.read_text(encoding="utf-8").splitlines()
          candidates = [
              index for index, line in enumerate(gradle_lines)
              if "applicationId" in line and "com.isivolt.maginaaventura" in line
          ]
          if len(candidates) != 1:
              raise SystemExit(
                  f"Expected exactly one generated applicationId, found {len(candidates)}"
              )

          index = candidates[0]
          gradle_lines[index] = gradle_lines[index].replace(
              "com.isivolt.maginaaventura",
              "com.isivolt.maginaaventura.routesim",
              1,
          )

          string_lines = strings.read_text(encoding="utf-8").splitlines()
          labels = [
              index for index, line in enumerate(string_lines)
              if 'name="app_name"' in line
          ]
          if len(labels) != 1:
              raise SystemExit(
                  f"Expected exactly one generated app_name, found {len(labels)}"
              )

          label_index = labels[0]
          prefix = string_lines[label_index].split(">", 1)[0]
          string_lines[label_index] = f"{prefix}>Mágina Aventura QA</string>"

          build_gradle.write_text("\n".join(gradle_lines) + "\n", encoding="utf-8")
          strings.write_text("\n".join(string_lines) + "\n", encoding="utf-8")
          PY

          grep -Fq 'com.isivolt.maginaaventura.routesim' android/app/build.gradle
          grep -Fq 'Mágina Aventura QA' android/app/src/main/res/values/strings.xml

      - name: Build standalone x86_64 simulator APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon

      - name: Create evidence directory
        run: mkdir -p artifacts/route-01-emulator-smoke

      - name: Boot emulator and smoke test isolated simulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -u
            APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
            OUT="artifacts/route-01-emulator-smoke"
            PACKAGE="$QA_PACKAGE"

            test -f "$APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PACKAGE" || true

            echo "Launching $PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 > "$OUT/monkey-launch.txt" 2>&1 || true
            sleep 15

            adb exec-out screencap -p > "$OUT/startup.png" || true
            adb shell uiautomator dump /sdcard/route01-window.xml > "$OUT/uiautomator.txt" 2>&1 || true
            adb pull /sdcard/route01-window.xml "$OUT/window.xml" > "$OUT/uiautomator-pull.txt" 2>&1 || true
            adb shell dumpsys activity activities > "$OUT/activity.txt" 2>&1 || true
            adb logcat -d > "$OUT/logcat-all.txt" 2>&1 || true

            PID="$(adb shell pidof "$PACKAGE" 2>/dev/null | tr -d '\r' || true)"
            if [[ -n "$PID" ]]; then
              adb logcat --pid="$PID" -d > "$OUT/logcat-package.txt" 2>&1 || true
              PROCESS_ALIVE=1
            else
              cp "$OUT/logcat-all.txt" "$OUT/logcat-package.txt"
              PROCESS_ALIVE=0
            fi

            UI_MARKER=unknown
            if [[ -f "$OUT/window.xml" ]]; then
              if grep -Fq "SIMULACIÓN QA" "$OUT/window.xml"; then
                UI_MARKER=present
              else
                UI_MARKER=not_exposed_in_hierarchy
              fi
            fi

            {
              echo "repository=izc05/izc05-magina-aventura"
              echo "git_sha=${{ github.sha }}"
              echo "workflow_run=${{ github.run_id }}"
              echo "android_api=34"
              echo "emulator_arch=x86_64"
              echo "application_id=$PACKAGE"
              echo "process_alive=$PROCESS_ALIVE"
              echo "ui_marker=$UI_MARKER"
              echo "qa_simulated=1"
              echo "physical_gps_gate=NOT_APPLICABLE"
              echo "pedometer_gate=NOT_APPLICABLE"
            } > "$OUT/metadata.txt"

            cat "$OUT/metadata.txt"

            if [[ "$PROCESS_ALIVE" != "1" ]]; then
              echo "Simulator process is not alive after cold launch."
              exit 1
            fi

            if grep -E -q "FATAL EXCEPTION|Fatal signal|Process: $PACKAGE.*has died" "$OUT/logcat-package.txt"; then
              echo "Fatal crash signature detected in simulator process logs."
              exit 1
            fi

      - name: Upload emulator smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: route-01-emulator-smoke-${{ github.run_number }}
          path: artifacts/route-01-emulator-smoke
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
