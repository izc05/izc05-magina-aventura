name: Android Route Simulator Integration QA APK

on:
  push:
    branches:
      - feat/route-01-simulator-app-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-route-simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_QA_BYPASS_AUTH: '1'
      EXPO_PUBLIC_ENABLE_QA_ROUTE_SIMULATOR: '1'
      EXPO_PUBLIC_QA_ROUTE_SIMULATOR_ENTRY: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generate clean Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Isolate simulator application id and label
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          build_gradle = Path("android/app/build.gradle")
          strings = Path("android/app/src/main/res/values/strings.xml")

          gradle_lines = build_gradle.read_text(encoding="utf-8").splitlines()
          candidates = [
              index for index, line in enumerate(gradle_lines)
              if "applicationId" in line and "com.isivolt.maginaaventura" in line
          ]
          if len(candidates) != 1:
              raise SystemExit(
                  f"Expected exactly one generated applicationId, found {len(candidates)}"
              )

          index = candidates[0]
          gradle_lines[index] = gradle_lines[index].replace(
              "com.isivolt.maginaaventura",
              "com.isivolt.maginaaventura.routesim",
              1,
          )

          string_lines = strings.read_text(encoding="utf-8").splitlines()
          labels = [
              index for index, line in enumerate(string_lines)
              if 'name="app_name"' in line
          ]
          if len(labels) != 1:
              raise SystemExit(
                  f"Expected exactly one generated app_name, found {len(labels)}"
              )

          label_index = labels[0]
          prefix = string_lines[label_index].split(">", 1)[0]
          string_lines[label_index] = f"{prefix}>Mágina Aventura QA</string>"

          build_gradle.write_text("\n".join(gradle_lines) + "\n", encoding="utf-8")
          strings.write_text("\n".join(string_lines) + "\n", encoding="utf-8")
          PY

          grep -Fq 'com.isivolt.maginaaventura.routesim' android/app/build.gradle
          grep -Fq 'Mágina Aventura QA' android/app/src/main/res/values/strings.xml

      - name: Build standalone ARM64 simulator APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Verify APK and write metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          META="apps/mobile/android/app/build/outputs/apk/release/route-simulator-metadata.txt"

          test -f "$APK"

          apk_bytes=$(stat -c%s "$APK")
          apk_mib=$(awk "BEGIN { printf \"%.2f\", $apk_bytes / 1024 / 1024 }")
          apk_sha256=$(sha256sum "$APK" | awk '{print $1}')

          mapfile -t abis < <(unzip -Z1 "$APK" | awk -F/ '/^lib\// {print $2}' | sort -u)
          if [[ ${#abis[@]} -ne 1 || "${abis[0]}" != "arm64-v8a" ]]; then
            echo "Expected ARM64-only APK; found: ${abis[*]}"
            exit 1
          fi

          {
            echo "repository=izc05/izc05-magina-aventura"
            echo "git_sha=${{ github.sha }}"
            echo "workflow_run=${{ github.run_id }}"
            echo "apk_sha256=$apk_sha256"
            echo "apk_bytes=$apk_bytes"
            echo "apk_mib=$apk_mib"
            echo "abi=arm64-v8a"
            echo "application_id=com.isivolt.maginaaventura.routesim"
            echo "qa_simulated=1"
            echo "physical_gps_gate=NOT_APPLICABLE"
            echo "ranking_eligible=0"
            echo "sponsor_redemption_eligible=0"
          } > "$META"

          cat "$META"

      - name: Upload simulator APK
        uses: actions/upload-artifact@v4
        with:
          name: magina-aventura-route-simulator-integration-arm64-${{ github.run_number }}
          path: |
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            apps/mobile/android/app/build/outputs/apk/release/route-simulator-metadata.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
