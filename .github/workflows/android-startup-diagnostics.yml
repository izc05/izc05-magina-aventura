name: Android Startup Diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches:
      - integration/android-beta-02-manus
    paths:
      - '.github/workflows/android-startup-diagnostics.yml'
      - 'apps/mobile/**'
      - 'packages/**'
      - 'scripts/android-startup-smoke.sh'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

jobs:
  standalone-startup-smoke:
    name: QA standalone startup smoke (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: phase4c-qa
      EXPO_PUBLIC_ENABLE_QA_HARNESS: 'true'
      EXPO_PUBLIC_BUILD_TYPE: phase4c-qa
      EXPO_PUBLIC_GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPO_PUBLIC_CI_RUN_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_APP_VERSION: '0.1.0'
    steps:
      - name: Checkout exact diagnostic SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate approved brand raster assets
        working-directory: apps/mobile
        run: pnpm brand:assets

      - name: Generate QA Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build QA standalone release APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify standalone JS bundle and Hermes
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Eq '^assets/index\.android\.bundle$'
          unzip -Z1 "$apk" | grep -Eq '^lib/[^/]+/libhermesvm\.so$'

      - name: Run real Android API 36 startup smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            bash scripts/android-startup-smoke.sh \
              apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
              artifacts/android-startup-diagnostics \
              com.isivolt.maginaaventura.qa

      - name: Write build metadata
        if: always()
        run: |
          mkdir -p artifacts/android-startup-diagnostics
          cat > artifacts/android-startup-diagnostics/BUILD_INFO.txt <<EOF
          commit=${{ github.event.pull_request.head.sha || github.sha }}
          branch=${{ github.head_ref || github.ref_name }}
          workflow_run=${{ github.run_number }}
          package_id=com.isivolt.maginaaventura.qa
          build_type=phase4c-qa-startup-diagnostics
          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

      - name: Upload startup diagnostics artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magina-aventura-startup-diagnostics-${{ github.run_number }}
          path: |
            artifacts/android-startup-diagnostics/startup-smoke-logcat.txt
            artifacts/android-startup-diagnostics/startup-smoke-result.txt
            artifacts/android-startup-diagnostics/startup-smoke-first-screen.png
            artifacts/android-startup-diagnostics/startup-smoke-launch.txt
            artifacts/android-startup-diagnostics/BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
