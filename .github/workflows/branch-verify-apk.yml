name: Verify and build Android APK

on:
  push:
    branches:
      - main
      - fix/antigravity-stabilization
  workflow_dispatch:

permissions:
  contents: read

env:
  EXPO_PUBLIC_SUPABASE_URL: https://klchkjsdybbgritxkswp.supabase.co
  EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_neY7nXnGfgjhMa4rIv2AmQ_5DMnJY54

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Expo Android prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magina-aventura-android-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
