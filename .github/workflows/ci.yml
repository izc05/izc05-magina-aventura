name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Verify pure package boundaries
        run: |
          if grep -R -n -E "from ['\"]expo|@supabase|maplibre|react-native" packages/domain packages/geo packages/contracts packages/offline-sync; then
            echo "Infrastructure import detected in pure packages"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase database
        run: supabase db start

      - name: Reset local Supabase database
        run: supabase db reset

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --no-backup
