name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Verify Android Expo prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Verify Android location manifest contract
        working-directory: apps/mobile
        run: |
          APP_MANIFEST="android/app/src/main/AndroidManifest.xml"
          LOCATION_MANIFEST="node_modules/expo-location/android/src/main/AndroidManifest.xml"

          test -f "$APP_MANIFEST"
          test -f "$LOCATION_MANIFEST"

          grep -q 'android.permission.ACCESS_FINE_LOCATION' "$APP_MANIFEST"
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' "$APP_MANIFEST"
          grep -q 'android.permission.ACCESS_BACKGROUND_LOCATION' "$APP_MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE' "$APP_MANIFEST"
          grep -q 'android.permission.FOREGROUND_SERVICE_LOCATION' "$APP_MANIFEST"

          grep -q 'LocationTaskService' "$LOCATION_MANIFEST"
          grep -q 'android:foregroundServiceType="location"' "$LOCATION_MANIFEST"

      - name: Verify pure package boundaries
        run: |
          if grep -R -n -E --exclude-dir=node_modules --exclude-dir=.pnpm "from ['\"]expo|@supabase|maplibre|react-native" packages/domain/src packages/geo/src packages/contracts/src packages/offline-sync/src packages/route-import/src; then
            echo "Infrastructure import detected in pure packages"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase database
        run: supabase db start

      - name: Reset local Supabase database
        run: supabase db reset

      - name: Database contract tests
        run: supabase test db

      - name: Stop local Supabase database
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi
