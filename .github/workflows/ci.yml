name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feat/integration-gps-visual-v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Generate approved brand raster assets
        working-directory: apps/mobile
        run: pnpm brand:assets

      - name: Verify Android Expo prebuild
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Verify Android background location permissions
        run: |
          manifest="apps/mobile/android/app/src/main/AndroidManifest.xml"
          for permission in \
            android.permission.ACCESS_FINE_LOCATION \
            android.permission.ACCESS_COARSE_LOCATION \
            android.permission.ACCESS_BACKGROUND_LOCATION \
            android.permission.FOREGROUND_SERVICE \
            android.permission.FOREGROUND_SERVICE_LOCATION; do
            if ! grep -q "$permission" "$manifest"; then
              echo "Missing required Android location permission: $permission"
              exit 1
            fi
          done

      - name: Verify pure package boundaries
        run: |
          if grep -R -n -E --exclude-dir=node_modules --exclude-dir=.pnpm "from ['\"]expo|@supabase|maplibre|react-native" packages/domain/src packages/geo/src packages/contracts/src packages/offline-sync/src packages/route-import/src packages/activity-engine/src; then
            echo "Infrastructure import detected in pure packages"
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Start local Supabase database
        run: supabase db start

      - name: Reset local Supabase database
        run: supabase db reset

      - name: Database contract tests
        run: supabase test db

      - name: Stop local Supabase database
        if: always()
        run: |
          if command -v supabase >/dev/null 2>&1; then
            supabase stop --no-backup
          fi

      - name: Setup Java for Android build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Android GPS candidate APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload Android GPS candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: magina-aventura-gps-v1-debug-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Verify Phase 4C QA harness bundle isolation
        working-directory: apps/mobile
        run: pnpm qa:verify-product-bundle

      - name: Generate Phase 4C QA Android project
        working-directory: apps/mobile
        env:
          APP_VARIANT: phase4c-qa
          EXPO_PUBLIC_ENABLE_QA_HARNESS: 'true'
          EXPO_PUBLIC_BUILD_TYPE: phase4c-qa
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_CI_RUN_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_APP_VERSION: '0.1.0'
        run: pnpm exec expo prebuild --platform android --no-install --clean

      - name: Build Android Phase 4C QA standalone APK
        working-directory: apps/mobile/android
        env:
          APP_VARIANT: phase4c-qa
          EXPO_PUBLIC_ENABLE_QA_HARNESS: 'true'
          EXPO_PUBLIC_BUILD_TYPE: phase4c-qa
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_CI_RUN_NUMBER: ${{ github.run_number }}
          EXPO_PUBLIC_APP_VERSION: '0.1.0'
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify Phase 4C QA APK and prepare evidence
        shell: bash
        run: |
          set -euo pipefail
          apk="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          evidence_dir="apps/mobile/android/app/build/phase4c-qa"
          mkdir -p "$evidence_dir"

          test -s "$apk"

          if ! unzip -Z1 "$apk" | grep -Eq '^assets/index\.android\.bundle$'; then
            echo "ERROR: JavaScript bundle not found in APK"
            exit 1
          fi

          if ! unzip -Z1 "$apk" | grep -Eq '^lib/[^/]+/libhermesvm\.so$'; then
            echo "ERROR: Hermes VM library not found in APK"
            unzip -Z1 "$apk" | grep '^lib/' | grep -i hermes || true
            exit 1
          fi

          cp "$apk" "$evidence_dir/magina-aventura-phase4c-qa-standalone.apk"
          sha256sum "$evidence_dir/magina-aventura-phase4c-qa-standalone.apk" > "$evidence_dir/SHA256SUMS.txt"
          cat > "$evidence_dir/BUILD_INFO.txt" <<EOF
          commit=${{ github.sha }}
          branch=${{ github.head_ref || github.ref_name }}
          workflow_run=${{ github.run_number }}
          build_type=phase4c-qa-standalone-release
          generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          package_id=com.isivolt.maginaaventura.qa
          version=$(jq -r '.expo.version' apps/mobile/app.json)
          signing=debug-keystore-internal-qa-only-not-production
          js_bundle=assets/index.android.bundle
          hermes=embedded
          EOF

      - name: Upload Android Phase 4C QA standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: magina-aventura-phase4c-qa-standalone-${{ github.run_number }}
          path: apps/mobile/android/app/build/phase4c-qa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
