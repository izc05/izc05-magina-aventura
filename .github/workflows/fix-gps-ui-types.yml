name: Fix GPS UI types

on:
  push:
    branches:
      - feat/integration-gps-visual-v1
    paths:
      - .github/workflows/fix-gps-ui-types.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integration-gps-visual-v1
          fetch-depth: 0
      - name: Apply narrow type fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/app/routes/[slug]/prepare.tsx')
          s = p.read_text()
          s = s.replace('await activityRuntime.start(route);', 'await activityRuntime.start(route!);')
          s = s.replace("params: { slug: route.slug } });", "params: { slug: route!.slug } });")
          p.write_text(s)
          PY
          rm .github/workflows/fix-gps-ui-types.yml
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'apps/mobile/app/routes/[slug]/prepare.tsx' .github/workflows/fix-gps-ui-types.yml
          git commit -m "fix: narrow route inside GPS start callback"
          git push origin HEAD:feat/integration-gps-visual-v1
