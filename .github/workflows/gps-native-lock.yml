name: GPS Native Dependency Lock

on:
  push:
    branches:
      - feat/integration-gps-visual-v1
    paths:
      - .github/workflows/gps-native-lock.yml

permissions:
  contents: write

jobs:
  generate-native-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/integration-gps-visual-v1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Resolve Expo SDK 57 native dependencies
        run: >-
          pnpm --filter @magina-aventura/mobile add
          expo-sqlite@~57.0.0
          expo-location@~56.0.14
          expo-task-manager@~56.0.15
          --lockfile-only

      - name: Commit resolved manifests and remove helper workflow
        run: |
          rm .github/workflows/gps-native-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json pnpm-lock.yaml .github/workflows/gps-native-lock.yml
          git commit -m "build: resolve Expo GPS native dependencies"
          git push origin HEAD:feat/integration-gps-visual-v1
