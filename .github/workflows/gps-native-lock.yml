name: GPS Native Dependency Lock

on:
  push:
    branches:
      - feat/integration-gps-visual-v1
    paths:
      - .github/workflows/gps-native-lock.yml

permissions:
  contents: read

jobs:
  generate-native-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Resolve Expo SDK 57 native dependencies
        run: >-
          pnpm --filter @magina-aventura/mobile add
          expo-sqlite@~57.0.0
          expo-location@~56.0.14
          expo-task-manager@~56.0.15
          --lockfile-only

      - name: Stage generated manifests
        run: |
          mkdir -p generated/apps/mobile
          cp apps/mobile/package.json generated/apps/mobile/package.json
          cp pnpm-lock.yaml generated/pnpm-lock.yaml

      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: gps-native-dependency-lock
          path: generated
          if-no-files-found: error
          retention-days: 1
