name: Promo cinematic preview

on:
  push:
    branches:
      - feat/cinematic-promo-v1
    paths:
      - 'apps/promo/**'
      - '.github/workflows/promo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-promo
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: promo-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Verify promo branding, motion and navigation
        run: node --test apps/promo/test/*.test.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload promo site
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/promo
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
