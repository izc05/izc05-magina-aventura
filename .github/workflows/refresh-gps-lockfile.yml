name: Refresh GPS lockfile

on:
  push:
    branches:
      - feat/integration-gps-visual-v1
    paths:
      - apps/mobile/package.json
      - .github/workflows/refresh-gps-lockfile.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integration-gps-visual-v1
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Commit resolved lockfile and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-gps-lockfile.yml
          git add pnpm-lock.yaml .github/workflows/refresh-gps-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh activity engine workspace lockfile"
          git push origin HEAD:feat/integration-gps-visual-v1
