name: Repair lockfile

on:
  push:
    branches:
      - fix/antigravity-stabilization
    paths:
      - apps/mobile/package.json
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/antigravity-stabilization
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit and push lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile"
          git pull --rebase origin fix/antigravity-stabilization
          git push origin HEAD:fix/antigravity-stabilization
