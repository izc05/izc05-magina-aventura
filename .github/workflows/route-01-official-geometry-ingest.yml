name: ROUTE-01 Official Geometry Ingest

on:
  push:
    branches:
      - feat/route-01-official-geometry-ingest
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: route-01-official-geometry-ingest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_URL: https://www.juntadeandalucia.es/medioambiente/portal/documents/20151/91693279/18_Las_Vinas.kml/3a861247-00ee-0c65-c0d0-7b304acc9ff3?t=1675942382809
      PUBLISHED_LENGTH_M: '8720'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download official Junta KML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/route-01
          curl             --fail             --location             --retry 3             --retry-delay 2             --connect-timeout 20             --max-time 120             --user-agent 'Mozilla/5.0 (compatible; MaginaAventura-QA/1.0)'             "$SOURCE_URL"             --output artifacts/route-01/18_Las_Vinas.kml

          test -s artifacts/route-01/18_Las_Vinas.kml
          echo "Downloaded bytes: $(stat -c%s artifacts/route-01/18_Las_Vinas.kml)"
          sha256sum artifacts/route-01/18_Las_Vinas.kml

      - name: Verify KML signature
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/route-01/18_Las_Vinas.kml')
          raw = p.read_bytes()
          sample = raw[:4096].decode('utf-8', errors='ignore').lower()
          if '<kml' not in sample and 'opengis.net/kml' not in sample:
              raise SystemExit('Downloaded file does not look like KML')
          print('KML signature check: OK')
          PY

      - name: Analyze official geometry
        shell: bash
        run: |
          set -euo pipefail
          python scripts/qa/analyze-official-kml.py             artifacts/route-01/18_Las_Vinas.kml             --source-url "$SOURCE_URL"             --published-length-m "$PUBLISHED_LENGTH_M"             --output artifacts/route-01/geometry-report.json

      - name: Write provenance note
        shell: bash
        run: |
          set -euo pipefail
          cat > artifacts/route-01/PROVENANCE.txt <<EOF
          Source owner: Junta de Andalucía
          Source page: https://www.juntadeandalucia.es/medioambiente/portal/areas-tematicas/biodiversidad-geodiversidad-habitats/geodiversidad/geoturismo-andalucia
          Listed asset: Las Viñas — KML (15 KB)
          Direct asset URL: $SOURCE_URL
          Retrieved by workflow: ${{ github.run_id }}
          Git SHA: ${{ github.sha }}

          This artifact is retained for QA/source verification only.
          It does not change the product route status.
          The Las Viñas route remains simulation_only while the official listing reports temporary closure.
          EOF

      - name: Upload source + verification report
        uses: actions/upload-artifact@v4
        with:
          name: route-01-official-geometry-${{ github.run_number }}
          path: artifacts/route-01
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
